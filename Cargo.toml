[package]
name = "ai-media-router"
version = "0.1.0"
edition = "2024"
description = "MCP server + REST API for AI image and video generation across 40+ providers, with your own keys and a local asset library"
license = "MIT"
repository = "https://github.com/jutsuhq/ai-media-router"
homepage = "https://github.com/jutsuhq/ai-media-router"
readme = "README.md"
rust-version = "1.89"
keywords = ["mcp", "ai", "video-generation", "image-generation", "agents"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "multipart", "form"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server", "auth", "client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "signal", "sync", "process", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
