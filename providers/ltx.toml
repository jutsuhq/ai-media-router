key = "ltx"
name = "LTX"
catalog = ["LTX"]
docs = "https://docs.ltx.io/async-jobs"
model_hint = "`model` is the LTX v2 endpoint name, not the model: `text-to-video`, `image-to-video`, `audio-to-video`, `retake`, `extend`, `video-to-video-reframe`. The LTX model id goes inside `input`, e.g. `{\"model\": \"ltx-2-5-pro\", \"prompt\": \"...\", \"duration\": 8, \"resolution\": \"1920x1080\"}`; image-to-video adds `image_uri` (https URL, data URI, or the `ltx://` value returned by upload)."
base_url = "https://api.ltx.io"
notes = "LTX picks the task by URL path and the model by a body field, so `model` carries the endpoint and the real model id (ltx-2-3-fast, ltx-2-3-pro, ltx-2-5-fast, ltx-2-5-pro) lives in `input.model`; catalog slugs therefore do not map 1:1 to `model`. Endpoint names other than text-to-video and image-to-video are taken from the docs index and not checked field by field. video-to-video-hdr returns `result.exr_frames_url`, which the output reader does not pick up. Upload returns an `ltx://` storage_uri (valid 24 h), passed as `image_uri` / `video_uri` / `audio_uri`; the docs say POST /v1/upload takes no body, the engine sends `{}` (unverified). Data URIs are also accepted inline (7 MB images, 15 MB video/audio). Errors are non-2xx `{type: \"error\", error: {type, message}}`."

[example]
model = "image-to-video"
input = { model = "ltx-2-5-pro", prompt = "a red fox running through snow", duration = 8, resolution = "1920x1080", image_uri = "https://example.com/fox.png" }

[auth]
type = "bearer"
env = ["LTX_API_KEY"]

[submit]
url = "/v2/{{model}}"
body = "{{input}}"
capture = { id = "/id" }

[poll]
url = "/v2/{{model}}/{{id}}"
status = "/status"
success = ["completed"]
failure = ["failed"]
error = "/error/message"
outputs = ["/result/video_url"]

[upload]
type = "put"
url = "/v1/upload"
capture = { upload_url = "/upload_url", file_url = "/storage_uri" }
put_headers = "/required_headers"
