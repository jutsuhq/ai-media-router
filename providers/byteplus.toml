key = "byteplus"
name = "BytePlus ModelArk"
catalog = ["BytePlus"]
docs = "https://docs.byteplus.com/en/docs/modelark/create-video-generation-task-api"
model_hint = "`model` is a ModelArk Model ID activated in your console (or your Endpoint ID), e.g. `dreamina-seedance-2-0-260128` (video) or `seedream-5-0-260128` (image; any id containing `seedream`, or prefix `image:`; `video:` forces the video endpoint). For Seedance, `input` holds the request fields besides `model`: `content` (array of `{type:\"text\",text}`, `{type:\"image_url\",image_url:{url},role:\"first_frame\"|\"last_frame\"|\"reference_image\"}`, `video_url`/`audio_url` items) plus top-level `ratio`, `duration`, `resolution`, `generate_audio`, `seed`, `watermark`; for Seedream, `input` is `{prompt, image?, size?, watermark?}`."
base_url = "https://ark.ap-southeast.bytepluses.com/api/v3"
cost_unit = "tokens"
notes = "docs.byteplus.com renders client-side and could not be read; endpoints, statuses and pointers mirror the identical Volcengine Ark API (docs.volcengine.com/docs/82379/1520757, /1521309, /1541523) and the host comes from third-party guides — verify against the BytePlus console. Keys are region-bound; other regions use another host. Unactivated models fail with 404 ModelNotOpen. Seedream (POST /images/generations) is synchronous and returns `data[].url` (valid 24 h); keep `response_format` = `url`: `b64_json` has no MIME field and is not read. Per-image failures sit in `data[].error` and the other images still return; do not set `stream`. `cost` is tokens."

[example]
model = "dreamina-seedance-2-0-260128"
input = { content = [{ type = "text", text = "a red fox running through snow" }, { type = "image_url", image_url = { url = "https://example.com/fox.png" }, role = "first_frame" }], ratio = "16:9", duration = 5, resolution = "720p" }

[auth]
type = "bearer"
env = ["BYTEPLUS_API_KEY"]

[submit]
url = "/contents/generations/tasks"
body = { model = "{{model}}", "$merge" = "{{input}}" }
capture = { id = "/id" }

[poll]
url = "/contents/generations/tasks/{{id}}"
status = "/status"
success = ["succeeded"]
failure = ["failed", "cancelled", "expired"]
error = "/error/message"
cost = "/usage/completion_tokens"
outputs = ["/content/video_url"]

[upload]
type = "data_uri"

[[route]]
strip_prefix = "video:"
models = ["video:*"]

[[route]]
strip_prefix = "image:"
models = ["image:*", "*seedream*"]
[route.submit]
url = "/images/generations"
body = { model = "{{model}}", "$merge" = "{{input}}" }
cost = "/usage/output_tokens"
outputs = ["/data/*/url"]
